name: Update daily NFL research data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16,18,20,22 * * *" # 12:15–6:15 p.m. Eastern during daylight saving time

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update daily NFL slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/update_daily_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_game_inputs.csv data/source_log.csv
          git diff --cached --quiet || git commit -m "Update daily NBA research data"
          git push
